workflows:
  ios-workflow:
    name: Vitae iOS
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      node: 22
      vars:
        BUNDLE_ID: com.pauwelsaldo.vitae
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          # Verify credentials before use
          echo "Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          python3 -c "
import os, sys
key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
print(f'ASC key length (chars): {len(key)}')
print(f'ASC key first line: {key.split(chr(10))[0]}')
try:
    from cryptography.hazmat.primitives.serialization import load_pem_private_key
    k = load_pem_private_key(key.encode(), password=None)
    print(f'ASC key OK - type: {type(k).__name__}')
except Exception as e:
    print(f'ASC key ERROR: {e}')
    sys.exit(1)
cert_key = os.environ.get('CERTIFICATE_PRIVATE_KEY', '')
print(f'Cert key length (chars): {len(cert_key)}')
try:
    k2 = load_pem_private_key(cert_key.encode(), password=None)
    print(f'Cert key OK - type: {type(k2).__name__}')
except Exception as e:
    print(f'Cert key ERROR: {e}')
    sys.exit(1)
"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - build/export/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
