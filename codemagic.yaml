workflows:
  ios-workflow:
    name: Vitae iOS
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      node: 22
      vars:
        BUNDLE_ID: com.pauwelsaldo.vitae
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Diagnose credentials
        script: |
          echo "=== CREDENTIAL CHECK ==="
          echo "KEY_ID value: '$APP_STORE_CONNECT_KEY_IDENTIFIER'"
          echo "ISSUER_ID value: '$APP_STORE_CONNECT_ISSUER_ID'"
          echo "ASC key length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "ASC key line count: $(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | wc -l)"
          echo "ASC key first line: $(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | head -1)"
          echo "ASC key last line: $(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tail -1)"
          echo "CERT key length: ${#CERTIFICATE_PRIVATE_KEY}"
          echo "CERT key line count: $(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | wc -l)"
          echo "=== END CHECK ==="

      - name: Fetch signing files
        script: |
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          echo "Written ASC key: $(wc -c < /tmp/asc_key.p8) bytes, $(wc -l < /tmp/asc_key.p8) lines"
          echo "First line of file: $(head -1 /tmp/asc_key.p8)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --private-key @file:/tmp/asc_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --certificate-key @file:/tmp/cert_key.pem \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - build/export/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
